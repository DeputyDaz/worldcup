<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2026 World Cup Sweep</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="hero">
      <nav class="topbar" aria-label="Site">
        <span class="brand">World Cup Sweep</span>
        <span class="status" id="lastUpdated">Loading odds...</span>
      </nav>
      <section class="hero-copy">
        <p class="eyebrow">2026 FIFA World Cup</p>
        <h1>Sweepstake tracker</h1>
        <p class="intro">Teams, sweep owners, and outright winner odds in one sortable live board.</p>
      </section>
    </header>

    <main class="shell">
      <section class="toolbar" aria-label="Controls">
        <label class="search">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Country or person">
        </label>

        <div class="sorter" role="group" aria-label="Sort teams">
          <button class="sort-button active" type="button" data-sort="country">Country A-Z</button>
          <button class="sort-button" type="button" data-sort="odds">Odds best-worst</button>
        </div>
      </section>

      <section class="summary" aria-label="Sweep summary">
        <div>
          <span class="summary-value" id="teamCount">0</span>
          <span class="summary-label">teams</span>
        </div>
        <div>
          <span class="summary-value" id="pricedCount">0</span>
          <span class="summary-label">with odds</span>
        </div>
        <div>
          <span class="summary-value" id="favouriteName">-</span>
          <span class="summary-label">current favourite</span>
        </div>
      </section>

      <section class="table-wrap" aria-label="Sweep table">
        <table>
          <thead>
            <tr>
              <th scope="col">Country</th>
              <th scope="col">Sweep owner</th>
              <th scope="col">Current odds</th>
              <th scope="col">Implied chance</th>
            </tr>
          </thead>
          <tbody id="teamRows"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
